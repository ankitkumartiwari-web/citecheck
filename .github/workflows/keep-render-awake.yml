name: Keep Render service warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: https://citecheck-kqdr.onrender.com/healthz
        run: curl --fail --silent --show-error --max-time 30 "$HEALTH_URL"
