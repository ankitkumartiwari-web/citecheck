name: Keep Render service warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: https://citecheck-kqdr.onrender.com/healthz
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 15
          --max-time 120
          --retry 2
          --retry-all-errors
          --retry-delay 5
          "$HEALTH_URL"